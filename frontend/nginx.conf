server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Proxy API to Spring Boot (service name "backend" in docker-compose)
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    client_max_body_size 50m;
    proxy_read_timeout 120s;
  }

  # React Router: always serve index.html on refresh
  location / {
    try_files $uri /index.html;
  }
}
